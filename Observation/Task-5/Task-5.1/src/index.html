<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>Interactive Product Calculator</h1>
    
        <label for="productName">Product Name:</label>
        <input type="text" id="productName" placeholder="Enter Product name">
        
        <label for="quantity">Quantity</label>
        <input type="number" name="" id="quantity" min="0" value="1" >

        <label for="price">Price: </label>
        <input type="number" id="price" min="0" step = "0.01" value = "0">

        <h2>Total Price : ₹<span id="total">0.00</span></h2>
    </div>
    <script src="./script.js"></script>
</body>
</html>
